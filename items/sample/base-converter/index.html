<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Base Converter</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f6f4;
      --surface: #ffffff;
      --text: #1c1c1e;
      --muted: #5d6167;
      --border: #dadad6;
      --accent: #2553b8;
      --error: #b3261e;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141517;
        --surface: #1d1f23;
        --text: #ececee;
        --muted: #a2a6ad;
        --border: #34373d;
        --accent: #93b1ff;
        --error: #ff8a80;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
    }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    .back { display: inline-block; margin-bottom: 16px; font-size: 0.95rem; }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.2; }
    .lead { margin: 0 0 24px; color: var(--muted); }

    /* Tool */
    .panel {
      display: grid;
      gap: 16px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    label { display: grid; gap: 6px; font-weight: 600; }
    .hint { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
    input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: 1.15rem ui-monospace, "SF Mono", Consolas, monospace;
    }
    input[aria-invalid="true"] { border-color: var(--error); }
    .status { min-height: 1.5em; margin: 0; color: var(--error); }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../../../module.html?m=sample">&larr; Sample Module</a>
    <h1>Number Base Converter</h1>
    <p class="lead">Type a whole number into any box. The other two update as you type.</p>

    <div class="panel">
      <label>Decimal <span class="hint">digits 0–9</span>
        <input id="dec" inputmode="numeric" autocomplete="off" spellcheck="false">
      </label>
      <label>Binary <span class="hint">digits 0 and 1</span>
        <input id="bin" inputmode="numeric" autocomplete="off" spellcheck="false">
      </label>
      <label>Hexadecimal <span class="hint">digits 0–9 and A–F</span>
        <input id="hex" autocomplete="off" spellcheck="false">
      </label>
      <p class="status" id="status" role="status"></p>
    </div>
  </main>

  <script>
    "use strict";

    // Each base: its input, the digits it accepts, and how to read/write it.
    const bases = [
      { input: document.getElementById("dec"), name: "decimal", pattern: /^[0-9]+$/, parse: function (s) { return BigInt(s); }, format: function (n) { return n.toString(10); } },
      { input: document.getElementById("bin"), name: "binary", pattern: /^[01]+$/, parse: function (s) { return BigInt("0b" + s); }, format: function (n) { return n.toString(2); } },
      { input: document.getElementById("hex"), name: "hexadecimal", pattern: /^[0-9a-f]+$/i, parse: function (s) { return BigInt("0x" + s); }, format: function (n) { return n.toString(16).toUpperCase(); } }
    ];
    const status = document.getElementById("status");

    bases.forEach(function (source) {
      source.input.addEventListener("input", function () {
        const text = source.input.value.trim();
        const others = bases.filter(function (b) { return b !== source; });

        bases.forEach(function (b) { b.input.removeAttribute("aria-invalid"); });
        status.textContent = "";

        if (text === "") {
          others.forEach(function (b) { b.input.value = ""; });
          return;
        }
        if (!source.pattern.test(text)) {
          source.input.setAttribute("aria-invalid", "true");
          status.textContent = "That isn't a valid " + source.name + " number.";
          return;
        }

        const value = source.parse(text);
        others.forEach(function (b) { b.input.value = b.format(value); });
      });
    });
  </script>
</body>
</html>
