<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binary Check-up</title>
  <script src="../../../tracker.js" data-module="sample" data-item="binary-quiz" data-type="quiz"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f6f4;
      --surface: #ffffff;
      --text: #1c1c1e;
      --muted: #5d6167;
      --border: #dadad6;
      --accent: #2553b8;
      --on-accent: #ffffff;
      --correct: #1e7a3c;
      --correct-soft: #e3f3e8;
      --wrong: #b3261e;
      --wrong-soft: #fbe7e5;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141517;
        --surface: #1d1f23;
        --text: #ececee;
        --muted: #a2a6ad;
        --border: #34373d;
        --accent: #93b1ff;
        --on-accent: #10131a;
        --correct: #7fd69a;
        --correct-soft: #173222;
        --wrong: #ff8a80;
        --wrong-soft: #3a1c1a;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
    }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
    .back { display: inline-block; margin-bottom: 16px; font-size: 0.95rem; }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.2; }
    .lead { margin: 0 0 24px; color: var(--muted); }

    /* Questions */
    ol { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
    .question {
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .prompt { margin: 0 0 12px; font-weight: 600; }
    .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    button {
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    button:disabled { cursor: default; }
    .options button:disabled:not(.correct):not(.wrong) { opacity: 0.55; }
    button.correct { background: var(--correct-soft); border-color: var(--correct); color: var(--correct); font-weight: 600; }
    button.wrong { background: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong); }
    .feedback { margin: 12px 0 0; }
    .feedback:empty { display: none; }

    /* Result */
    .result {
      margin-top: 24px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .result p { margin: 0 0 12px; font-size: 1.15rem; font-weight: 600; }
    .result button { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../../../module.html?m=sample">&larr; Sample Module</a>
    <h1>Binary Check-up</h1>
    <p class="lead">Pick an answer for each question. You'll see straight away whether it's right. Your result is saved on this device for My progress.</p>

    <ol id="questions"></ol>

    <div class="result" id="result" hidden>
      <p id="score" role="status"></p>
      <button type="button" id="retry">Try again</button>
    </div>
  </main>

  <script>
    "use strict";

    // To write a new quiz, replace these questions. "answer" is the index of the correct option.
    // "topic" groups questions for the progress pages, so the instructor can see weak areas.
    const QUESTIONS = [
      { prompt: "What is binary 101 in decimal?", options: ["3", "5", "6", "101"], answer: 1, topic: "Binary to decimal",
        explain: "101 = 4 + 0 + 1 = 5." },
      { prompt: "What is decimal 8 in binary?", options: ["100", "111", "1000", "1010"], answer: 2, topic: "Decimal to binary",
        explain: "8 is exactly the 8s place, so it's 1000." },
      { prompt: "How many different values can 4 bits hold?", options: ["4", "8", "15", "16"], answer: 3, topic: "Bits and range",
        explain: "Each bit doubles the count: 2 × 2 × 2 × 2 = 16 (from 0 to 15)." },
      { prompt: "What is hexadecimal F in decimal?", options: ["15", "16", "6", "F isn't a number"], answer: 0, topic: "Hexadecimal",
        explain: "Hex counts 0–9 then A–F, so F is 15." },
      { prompt: "What is the largest number 8 bits can hold?", options: ["128", "255", "256", "512"], answer: 1, topic: "Bits and range",
        explain: "11111111 = 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255." }
    ];

    const list = document.getElementById("questions");
    const result = document.getElementById("result");
    const scoreEl = document.getElementById("score");
    let answered = 0;
    let correct = 0;
    let answers = [];

    function render() {
      list.replaceChildren();
      answered = 0;
      correct = 0;
      answers = [];
      result.hidden = true;

      QUESTIONS.forEach(function (q, qi) {
        const item = document.createElement("li");
        item.className = "question";

        const prompt = document.createElement("p");
        prompt.className = "prompt";
        prompt.id = "q" + qi;
        prompt.textContent = (qi + 1) + ". " + q.prompt;

        const options = document.createElement("div");
        options.className = "options";
        options.setAttribute("role", "group");
        options.setAttribute("aria-labelledby", prompt.id);

        const feedback = document.createElement("p");
        feedback.className = "feedback";
        feedback.setAttribute("aria-live", "polite");

        q.options.forEach(function (text, oi) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = text;
          button.addEventListener("click", function () {
            choose(q, oi, options, feedback);
          });
          options.append(button);
        });

        item.append(prompt, options, feedback);
        list.append(item);
      });
    }

    function choose(q, chosen, options, feedback) {
      const buttons = Array.from(options.children);
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[q.answer].classList.add("correct");

      const right = chosen === q.answer;
      if (!right) buttons[chosen].classList.add("wrong");
      feedback.textContent = (right ? "Correct. " : "Not quite. ") + q.explain;

      answered += 1;
      if (right) correct += 1;
      answers.push({ q: q.prompt, topic: q.topic, correct: right });
      if (answered === QUESTIONS.length) {
        scoreEl.textContent = "You scored " + correct + " out of " + QUESTIONS.length + ".";
        result.hidden = false;
        if (window.Tracker) window.Tracker.quizResult(correct, QUESTIONS.length, answers);
      }
    }

    document.getElementById("retry").addEventListener("click", function () {
      render();
      window.scrollTo({ top: 0 });
      list.querySelector("button").focus();
    });

    render();
  </script>
</body>
</html>
