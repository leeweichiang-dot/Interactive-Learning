# Publishes the site to GitHub Pages. See DEPLOYMENT.md.
# It runs only when you start it by hand (Actions tab > Deploy to GitHub Pages > Run workflow).
# To publish automatically on every push to main, remove the # in front of the push lines below.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check links and assets
        run: node tools/check-links.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
